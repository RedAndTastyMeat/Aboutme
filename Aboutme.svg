<text x="450" y="45"  text-anchor="middle"  font-family="Arial, sans-serif" font-size="50" font-weight="bold"  fill="url(#gradient)">✟𝕬𝖇𝖔𝖚𝖙 𝖒𝖊✟</text>

  <text x="450" y="125"  text-anchor="middle"  font-family="Arial, sans-serif" font-size="40"  font-style="italic"  fill="url(#gradient)">✟𝓒𝓪𝓵𝓵 𝓶𝓮 𝓚𝓪𝔃𝔂 𝓸𝓻 𝓜𝓪𝔃𝔃✟</text>
  
    <text x="450" y="205"  text-anchor="middle"  font-family="Arial, sans-serif" font-size="40"  font-style="italic"  fill="#5E3936">༺✝︎༻𝗜𝗺 𝟭𝟲 𝘁𝘂𝗿𝗻𝗶𝗻𝗴 𝟭𝟳.༺✝︎༻</text>
  
  <text x="450" y="285"  text-anchor="middle"  font-family="Arial, sans-serif" font-size="40"  font-style="italic"  fill="#5E3936">✠𝓘 𝓾𝓼𝓾𝓪𝓵𝓵𝔂 𝓼𝓽𝓪𝔂 𝓪𝓽 𝓼𝓪𝓯𝓮 𝓥𝓝/ 𝓼𝓸𝓶𝓮𝓽𝓲𝓶𝓮𝓼 𝓘 𝓼𝓽𝓪𝔂 𝓪𝓽 𝓼𝓪𝓯𝓮✠</text>
  
  <text x="450" y="365"  text-anchor="middle"  font-family="Arial, sans-serif" font-size="40"  font-style="italic"  fill="#400101">✝𝓘 𝓹𝓻𝓮𝓽𝓽𝔂 𝓶𝓾𝓬𝓱 𝓱𝓪𝓽𝓮 𝓽𝓪𝓵𝓴𝓲𝓷𝓰 𝓽𝓸𝓸 𝓵𝓸𝓷𝓰 𝓪𝓫𝓸𝓾𝓽 𝓪 𝓽𝓸𝓹𝓲𝓬 𝓘 𝓭𝓸𝓷'𝓽 𝓬𝓪𝓻𝓮 𝓪𝓫𝓸𝓾𝓽✝</text>
  
  <text x="450" y="445"  text-anchor="middle"  font-family="Arial, sans-serif" font-size="40"  font-style="italic"  fill="#400101">✟𝓘 𝓱𝓪𝓽𝓮 𝓫𝓮𝓲𝓷𝓰 𝓫𝓸𝓽𝓱𝓮𝓻𝓮𝓭 𝓸𝓻 𝓽𝓮𝓪𝓼𝓮𝓭 𝓽𝓸𝓸 𝓶𝓾𝓬𝓱, 𝓼𝓸 𝓘’𝓵𝓵 𝓹𝓻𝓸𝓫𝓪𝓫𝓵𝔂 𝓬𝓾𝓻𝓼𝓮 𝓹𝓻𝓮𝓽𝓽𝔂 𝓱𝓮𝓪𝓿𝓲𝓵𝔂, 𝓼𝓸𝓻𝓻𝔂 𝓪𝓫𝓸𝓾𝓽 𝓽𝓱𝓪𝓽✟</text>

	<text x="450" y="525"  text-anchor="middle"  font-family="Arial, sans-serif" font-size="40"  font-style="italic"  fill="20101E">✟𝓘’𝓵𝓵 𝓸𝓯𝓽𝓮𝓷 𝓫𝓮 𝓐𝓕𝓚, 𝓼𝓸 𝓲𝓯 𝔂𝓸𝓾 𝔀𝓪𝓷𝓽 𝓽𝓸 𝓼𝓲𝓽 𝔀𝓲𝓽𝓱 𝓶𝓮, 𝓰𝓸 𝓪𝓱𝓮𝓪𝓭, 𝓳𝓾𝓼𝓽 𝓷𝓸 𝓱𝓾𝓰𝓰𝓲𝓷𝓰.✟</text>

	<text x="450" y="605"  text-anchor="middle"  font-family="Arial, sans-serif" font-size="40"  font-style="italic"  fill="#20101E">✟𝓘 𝓽𝓮𝓷𝓭 𝓽𝓸 𝓫𝓮 𝓹𝓻𝓮𝓽𝓽𝔂 𝓺𝓾𝓲𝓮𝓽 𝔀𝓱𝓮𝓷 𝓘 𝓯𝓲𝓻𝓼𝓽 𝓶𝓮𝓮𝓽 𝓼𝓸𝓶𝓮𝓸𝓷𝓮, 𝓫𝓾𝓽 𝓸𝓿𝓮𝓻 𝓽𝓲𝓶𝓮 𝓘’𝓵𝓵 𝓰𝓮𝓽 𝓬𝓱𝓮𝓮𝓻𝓯𝓾𝓵 𝓪𝓷𝓭 𝓹𝓪𝔂 𝓪𝓽𝓽𝓮𝓷𝓽𝓲𝓸𝓷 𝓽𝓸 𝔂𝓸𝓾✟</text>

     <text x="450" y="765"  text-anchor="middle"  font-family="Arial, sans-serif" font-size="40"  font-style="italic"  fill="#17192F">꒰ঌ ໒꒱𝙉𝙊𝙏𝙀꒰ঌ ໒꒱</text>
	
   <text x="450" y="845"  text-anchor="middle"  font-family="Arial, sans-serif" font-size="40"  font-style="italic"  fill="#17192F">⚠𝙋𝙡𝙚𝙖𝙨𝙚 𝙙𝙤 𝙣𝙤𝙩 𝙘𝙤𝙥𝙮 𝙢𝙮 𝙨𝙠𝙞𝙣 𝙬𝙞𝙩𝙝𝙤𝙪𝙩 𝙖𝙨𝙠𝙞𝙣𝙜 𝙛𝙞𝙧𝙨𝙩.⚠</text>
	
	<text x="450" y="925"  text-anchor="middle"  font-family="Arial, sans-serif" font-size="40"  font-style="italic"  fill="#17192F">⚠𝙄 𝙙𝙤 𝙣𝙤𝙩 𝙨𝙪𝙥𝙥𝙤𝙧𝙩 𝙩𝙝𝙞𝙣𝙜𝙨 𝙡𝙞𝙠𝙚 𝙧𝙤𝙡𝙚𝙥𝙡𝙖𝙮, 𝙧𝙖𝙘𝙞𝙨𝙢, 𝙙𝙖𝙧𝙠 𝙨𝙝𝙞𝙥𝙥𝙞𝙣𝙜, 𝙤𝙧 𝙞𝙣𝙘𝙚𝙨𝙩𝙪𝙤𝙪𝙨 𝙘𝙝𝙖𝙧𝙖𝙘𝙩𝙚𝙧 𝙥𝙖𝙞𝙧𝙞𝙣𝙜𝙨.⚠</text>
	
  <rect x="250" y="1005" width="510" height="2" rx="3" fill="url(#gradient)" opacity=".8"></rect>
  
