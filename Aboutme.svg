<stop offset="0%" stop-color="#5E3936"></stop>
  
<stop offset="25%" stop-color="#400101"></stop>

  <stop offset="50%" stop-color="#20101E"></stop>

  <stop offset="100%" stop-color="#17192F"></stop>
    
</linearGradient>
